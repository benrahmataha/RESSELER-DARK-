
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>TAHA RESELLER — Official Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#080808;--red:#ff1744;--fg:#f4f1f1;
 --muted:#858080;--ok:#43d98b;
 --grad:linear-gradient(180deg,#ff244b,#ed002f);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:"Rajdhani",sans-serif}
body{
 min-height:100dvh;overflow-x:hidden;
 background:radial-gradient(100% 55% at 50% 0%,rgba(130,0,20,.28),transparent 70%),linear-gradient(180deg,#10090b,#050505 65%);
 display:flex;justify-content:center;align-items:center;padding:22px 16px;
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;
 background-image:linear-gradient(rgba(255,23,68,.065) 1px,transparent 1px),linear-gradient(90deg,rgba(255,23,68,.065) 1px,transparent 1px);
 background-size:44px 44px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.panel{
 position:relative;width:100%;max-width:440px;padding:25px 22px 20px;
 background:linear-gradient(160deg,rgba(26,20,21,.97),rgba(10,9,10,.98));
 border:1px solid #38272c;box-shadow:0 18px 55px #000a;border-radius:2px;
}
.logo{text-align:center;font:clamp(1.55rem,7vw,2rem) "Russo One";letter-spacing:.08em}
.logo span{color:var(--red)}
.sub{text-align:center;color:var(--muted);font:.72rem "Share Tech Mono";letter-spacing:.22em;margin:9px 0 28px}
.section-tag{display:flex;align-items:center;gap:9px;margin-bottom:15px;color:var(--red);font:.75rem "Share Tech Mono";letter-spacing:.15em}
.section-tag:before{content:"";width:7px;height:7px;background:var(--red);border-radius:50%;box-shadow:0 0 10px var(--red)}
.small{display:block;color:var(--muted);font:.72rem "Share Tech Mono";letter-spacing:.13em;margin-bottom:9px}
input{
 width:100%;height:3.55rem;padding:0 15px;background:#080808;
 border:1px solid #403237;border-radius:2px;color:white;
 font:.9rem "Share Tech Mono";outline:none;
}
input:focus{border-color:var(--red);box-shadow:0 0 18px #ff003326}
button.primary{
 width:100%;min-height:3.6rem;margin-top:15px;padding:12px;
 background:var(--grad);border:1px solid #ff526e;color:#080808;
 font:bold 1rem "Share Tech Mono";letter-spacing:.06em;
 box-shadow:0 0 20px #ff174433;
}
button.secondary{
 width:100%;min-height:2.9rem;margin-top:12px;padding:10px;
 background:#171112;border:1px solid #563039;color:#f1dce0;
 font:.85rem "Share Tech Mono";
}
.info{padding:16px 17px;margin-top:13px;background:#050505a0;border:1px solid #38292d}
.value{font:1.2rem "Russo One";margin-top:7px;overflow-wrap:anywhere}
.count{color:#ff4a69;font-size:1.65rem}
.hidden{display:none!important}
#error,#notice{text-align:center;font:.78rem "Share Tech Mono";margin-top:12px}
#error{color:#ff526e}
#notice{color:var(--ok)}
.footer{text-align:center;color:#62595b;font:.65rem "Share Tech Mono";letter-spacing:.12em;margin-top:25px}
.dashboard-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:21px;padding-bottom:16px;border-bottom:1px solid #38272c}
.mini-brand{font:.9rem "Russo One"}
.mini-brand span{display:block;color:var(--red);font:.62rem "Share Tech Mono";margin-top:5px}
.status{color:var(--ok);font:.68rem "Share Tech Mono"}
.status:before{content:"● ";}
.keybox{
 display:none;margin-top:17px;padding:14px;
 background:linear-gradient(145deg,#370c1655,#0c080a);
 border:1px solid #a2223e;
}
.key-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:340px;overflow-y:auto}
.key-row{
 display:flex;align-items:center;justify-content:space-between;gap:8px;
 padding:10px;background:#080808;border:1px solid #39262b;
}
.key-text{
 flex:1;min-width:0;color:#ff6a83;
 font:.78rem "Share Tech Mono";overflow-wrap:anywhere;
}
.copy-one{
 flex-shrink:0;padding:8px 10px;background:#301019;
 border:1px solid #a2223e;color:#ff7189;
 font:.68rem "Share Tech Mono";
}
.copy-one:active{background:#a2223e;color:white}
.quantity-box{margin-top:17px}
#quantity{height:3.2rem}
</style>
</head>

<body>
<main class="panel">

<div class="logo">TAHA <span>RESELLER</span></div>
<div class="sub">// OFFICIAL KEY GENERATOR_</div>

<section id="login">
 <div class="section-tag">RESELLER AUTHENTICATION</div>
 <label class="small" for="password">RESELLER PASSWORD</label>
 <input id="password" type="password" placeholder="ENTER YOUR PASSWORD" autocomplete="off">
 <button class="primary" id="loginBtn">LOGIN →</button>
 <div id="error"></div>
</section>

<section id="dashboard" class="hidden">
 <div class="dashboard-head">
  <div class="mini-brand">TAHA RESELLER
   <span>CONTROL PANEL</span>
  </div>
  <div class="status">AUTHORIZED</div>
 </div>

 <div class="section-tag">DISTRIBUTOR OVERVIEW</div>

 <div class="info">
  <span class="small">RESELLER NAME</span>
  <div class="value" id="resellerName">---</div>
 </div>

 <div class="info">
  <span class="small">AVAILABLE KEYS</span>
  <div class="value count" id="remaining">0</div>
 </div>

 <div class="quantity-box">
  <label class="small" for="quantity">HOW MANY KEYS DO YOU WANT?</label>
  <input id="quantity" type="number" min="1" step="1" value="1">
 </div>

 <button class="primary" id="generateBtn">＋ GENERATE KEYS</button>

 <div class="keybox" id="keybox">
  <span class="small">YOUR GENERATED KEYS</span>
  <div class="key-list" id="generatedKeys"></div>
  <button class="secondary" id="copyBtn">COPY ALL KEYS</button>
  <div id="notice"></div>
 </div>

 <button class="secondary" id="logoutBtn">LOGOUT</button>
</section>

<div class="footer">
 TAHA RESELLER PANEL © 2026<br>
 ALL RIGHTS RESERVED.
</div>
</main>

// LOGIN AND SYSTEM

const STORAGE_KEY = "taha_reseller_used_keys_v2";

let current = null;
let generated = [];

const $ = id => document.getElementById(id);

function getUsedKeys(){
 try{
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
  return Array.isArray(data)?data:[];
 }catch(e){return []}
}

function saveUsedKeys(data){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function getAvailableKeys(){
 if(!current)return [];
 const used=getUsedKeys();

 return distributors[current].trim().split("\n")
 .map(x=>x.trim())
 .filter(Boolean)
 .filter(key=>!used.includes(current+":"+key));
}

function login(){
 const pass=$("password").value.trim().toUpperCase();

 if(!Object.prototype.hasOwnProperty.call(distributors,pass)){
  $("error").textContent="INVALID PASSWORD — TRY AGAIN";
  return;
 }

 current=pass;
 generated=[];

 $("error").textContent="";
 $("login").classList.add("hidden");
 $("dashboard").classList.remove("hidden");
 $("resellerName").textContent=current;
 $("keybox").style.display="none";
 $("quantity").value=1;

 updateCount();
}

function updateCount(){
 const available=getAvailableKeys();
 $("remaining").textContent=available.length;
 $("quantity").max=available.length;
}

function generate(){
 if(!current)return;

 const available=getAvailableKeys();
 const quantity=Number($("quantity").value);

 if(!Number.isInteger(quantity)||quantity<1){
  alert("PLEASE ENTER A VALID NUMBER");
  return;
 }

 if(quantity>available.length){
  alert("NOT ENOUGH KEYS! AVAILABLE: "+available.length);
  return;
 }

 generated=available.slice(0,quantity);

 const used=getUsedKeys();

 generated.forEach(key=>{
  used.push(current+":"+key);
 });

 saveUsedKeys(used);

 renderKeys();
 $("keybox").style.display="block";
 $("notice").textContent="";
 updateCount();
}

// DISPLAY EACH KEY WITH ITS OWN COPY BUTTON

function renderKeys(){
 const container=$("generatedKeys");
 container.innerHTML="";

 generated.forEach(key=>{
  const row=document.createElement("div");
  row.className="key-row";

  const text=document.createElement("div");
  text.className="key-text";
  text.textContent=key;

  const button=document.createElement("button");
  button.className="copy-one";
  button.textContent="COPY";

  button.addEventListener("click",async()=>{
   const success=await copyText(key);
   button.textContent=success?"COPIED":"FAILED";
   setTimeout(()=>button.textContent="COPY",1500);
  });

  row.appendChild(text);
  row.appendChild(button);
  container.appendChild(row);
 });
}

// COPY FUNCTION

async function copyText(text){
 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(text);
  }else{
   const area=document.createElement("textarea");
   area.value=text;
   area.style.position="fixed";
   area.style.opacity="0";
   document.body.appendChild(area);
   area.select();
   const success=document.execCommand("copy");
   area.remove();
   if(!success)throw new Error("Copy failed");
  }
  return true;
 }catch(e){
  return false;
 }
}

async function copyAll(){
 if(!generated.length)return;

 const success=await copyText(generated.join("\n"));

 $("notice").textContent=success?
 "ALL KEYS COPIED SUCCESSFULLY":
 "COPY FAILED";
}

function logout(){
 current=null;
 generated=[];

 $("dashboard").classList.add("hidden");
 $("login").classList.remove("hidden");

 $("password").value="";
 $("quantity").value=1;
 $("keybox").style.display="none";
 $("error").textContent="";
 $("notice").textContent="";
}

$("loginBtn").addEventListener("click",login);

$("password").addEventListener("keydown",e=>{
 if(e.key==="Enter")login();
});

$("generateBtn").addEventListener("click",generate);
$("copyBtn").addEventListener("click",copyAll);
$("logoutBtn").addEventListener("click",logout);

</script>
