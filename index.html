
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>TAHA RESELLER PANEL</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#080808;color:white;
 font-family:Arial,sans-serif;display:flex;justify-content:center;
 align-items:center;padding:20px;
}
.panel{
 width:100%;max-width:420px;background:#101010;
 border:1px solid #292929;border-radius:18px;
 padding:25px;box-shadow:0 15px 50px #000;
}
.logo{text-align:center;font-size:24px;font-weight:900;
 letter-spacing:2px;margin-bottom:8px}
.logo span{color:#b24cff}
.sub{text-align:center;color:#777;font-size:11px;
 letter-spacing:3px;margin-bottom:28px}
input{
 width:100%;padding:16px;background:#080808;
 border:1px solid #333;border-radius:10px;
 color:white;outline:none;font-size:15px;
}
input:focus{border-color:#a34aff}
button{
 width:100%;padding:15px;border:0;border-radius:10px;
 background:linear-gradient(90deg,#7725cf,#b34cff);
 color:white;font-weight:bold;font-size:14px;
 cursor:pointer;margin-top:15px;
}
button:active{transform:scale(.98)}
.info{
 background:#080808;border:1px solid #292929;
 padding:17px;border-radius:12px;margin:15px 0;
}
.small{color:#777;font-size:11px;letter-spacing:1px}
.value{font-size:20px;font-weight:bold;margin-top:7px}
.count{color:#bd69ff}
.keybox{
 display:none;background:#171020;border:1px solid #8039b6;
 padding:15px;border-radius:10px;margin-top:18px;
 text-align:center;word-break:break-all;
}
.key{font-size:23px;font-weight:bold;letter-spacing:3px;
 color:#d39aff;margin:10px 0}
.copy{background:#29202f}
.logout{background:#242424}
#error{color:#ff5555;text-align:center;font-size:13px;margin-top:12px}
.hidden{display:none}
.footer{text-align:center;color:#555;font-size:10px;margin-top:25px}
</style>
</head>
<body>
<div class="panel">
 <div class="logo">TAHA <span>RESELLER</span></div>
 <div class="sub">PREMIUM KEY GENERATOR</div>

 <div id="login">
  <div class="small">RESELLER PASSWORD</div>
  <input id="password" type="password" placeholder="Enter your password">
  <button onclick="login()">LOGIN</button>
  <div id="error"></div>
 </div>

 <div id="dashboard" class="hidden">
  <div class="info">
   <div class="small">RESELLER NAME</div>
   <div class="value" id="resellerName">---</div>
  </div>
  <div class="info">
   <div class="small">AVAILABLE KEYS</div>
   <div class="value count" id="remaining">0</div>
  </div>
  <button onclick="generate()">GENERATE KEY</button>

  <div class="keybox" id="keybox">
   <div class="small">YOUR GENERATED KEY</div>
   <div class="key" id="generatedKey"></div>
   <button class="copy" onclick="copyKey()">COPY KEY</button>
  </div>
  <button class="logout" onclick="logout()">LOGOUT</button>
 </div>
 <div class="footer">TAHA RESELLER PANEL © 2026</div>
</div>

<script>
const distributors = {

 RESSELER2: [

"113755","428236","987222","340175","380917","905143",

};

let current = null;
let generated = null;

function login(){
 const pass=document.getElementById("password").value.trim().toUpperCase();
 if(!distributors[pass]){
  document.getElementById("error").textContent="INVALID PASSWORD";
  return;
 }
 current=pass;
 document.getElementById("login").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 document.getElementById("resellerName").textContent=current;
 updateCount();
}

function usedKeys(){
 try{return JSON.parse(localStorage.getItem("used_keys")||"[]")}
 catch(e){return []}
}

function updateCount(){
 const used=usedKeys();
 const available=distributors[current].filter(k=>!used.includes(current+":"+k));
 document.getElementById("remaining").textContent=available.length;
}

function generate(){
 const used=usedKeys();
 const available=distributors[current].filter(k=>!used.includes(current+":"+k));
 if(!available.length){
  alert("NO KEYS AVAILABLE");
  return;
 }
 const key=available[0];
 used.push(current+":"+key);
 localStorage.setItem("used_keys",JSON.stringify(used));
 generated=key;
 document.getElementById("generatedKey").textContent=key;
 document.getElementById("keybox").style.display="block";
 updateCount();
}

function copyKey(){
 if(!generated)return;
 if(navigator.clipboard && window.isSecureContext){
  navigator.clipboard.writeText(generated).then(()=>alert("KEY COPIED"));
 }else{
  const t=document.createElement("textarea");
  t.value=generated;document.body.appendChild(t);
  t.select();document.execCommand("copy");t.remove();
  alert("KEY COPIED");
 }
}

function logout(){
 current=null;generated=null;
 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 document.getElementById("password").value="";
 document.getElementById("keybox").style.display="none";
 document.getElementById("error").textContent="";
}
</script>
</body>
</html>
